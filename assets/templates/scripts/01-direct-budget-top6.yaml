id: template
title: ТОП-6 причин, почему Директ сливает бюджет
content_type: expert
topic: Шесть настроек Яндекс Директа и Метрики, через которые чаще всего утекает бюджет
idea: 'Обратный отсчёт: шесть проверок, которые можно сделать в своём кабинете сегодня'
audience: Владельцы интернет-магазинов и маркетологи, которые сами ведут Директ
problem: Бюджет уходит на нецелевые запросы, мусорные площадки и нецелевую аудиторию, а посадочная теряет людей
format: 'ТОП-6 обратным отсчётом: кот открывает и закрывает, пункты — карточки и макеты отчётов'
target_duration: 55
tone: уверенно, по делу, лёгкая ирония
hook: Директ сливает бюджет? Смотрите, куда уходят деньги.
