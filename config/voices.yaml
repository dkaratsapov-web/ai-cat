# Голосовые пресеты. Сценарий выбирает пресет полем voice_preset (по умолчанию — default).
# Провайдер озвучки задаётся в config/studio.yaml → providers.tts (или флагом studio voice --provider).
presets:
  # --- Yandex SpeechKit (основной) ---
  # voice: голос (послушать и выбрать — в демо SpeechKit в консоли Yandex Cloud).
  # role: амплуа (например neutral / good / friendly) — поддерживается не всеми голосами; оставьте null, если сомневаетесь.
  # speed: темп 0.1–3.0; pitch_shift: сдвиг высоты в Гц (-1000…1000) — можно сделать голос «кошачьим».
  # Голос кота выбран на слух владельцем: ermil + мультяшная обработка ×1.5 (образец ermil_s1.1_cat1.5)
  default:
    provider: yandex
    voice: ermil
    role: null
    speed: 1.1
    pitch_shift: 0
    # Локальная обработка после озвучки (бесплатно): pitch — во сколько раз выше тон (1.0 — без изменений),
    # formant: shifted — мультяшный/детский тембр, preserved — тот же голос, просто выше
    effect: {pitch: 1.5, formant: shifted}
  # Экспертный голос без мультяшной обработки (ТЗ фитнес-ролика: уверенно, спокойно, не быстро)
  expert:
    provider: yandex
    voice: ermil
    role: null
    speed: 1.1
    pitch_shift: 0
    effect: null
  calm:
    provider: yandex
    voice: ermil
    role: null
    speed: 1.0
    pitch_shift: 0
    effect: {pitch: 1.5, formant: shifted}
  energetic:
    provider: yandex
    voice: ermil
    role: null
    speed: 1.2
    pitch_shift: 0
    effect: {pitch: 1.5, formant: shifted}

  # --- OpenAI TTS (тест: studio voice-samples --provider openai) ---
  # Голоса: ash, ballad, cedar, echo, onyx, verse, marin, alloy, fable, sage, coral, nova, shimmer.
  # instructions — как говорить (по-русски, своими словами).
  gpt:
    provider: openai
    model_id: gpt-4o-mini-tts
    voice: ash
    speed: 1.1
    instructions: >-
      Говори по-русски, как ироничный и уверенный кот-маркетолог: живо, с лёгкой улыбкой в голосе, чёткая дикция,
      естественные паузы, без дикторского пафоса. Темп бодрый, как в коротком видео для соцсетей.

  # --- Сбер SaluteSpeech (тест: studio voice-samples --provider salute) ---
  # Голоса 24 кГц: Bys_24000 Борис, Tur_24000 Тарас, Pon_24000 Сергей (мужские); Nec_24000 Наталья,
  # May_24000 Марфа, Ost_24000 Александра. Темп меняется локально (без искажения тона).
  salute:
    provider: salute
    voice: Bys_24000
    speed: 1.1

  # --- ElevenLabs (альтернатива: studio voice <id> --provider elevenlabs, voice_preset: elevenlabs) ---
  elevenlabs:
    provider: elevenlabs
    voice_id: null              # или ELEVENLABS_VOICE_ID в .env
    model_id: eleven_multilingual_v2
    language_code: ru
    output_format: mp3_44100_128
    voice_settings:
      stability: 0.5
      similarity_boost: 0.8
      style: 0.25
      use_speaker_boost: true
      speed: 1.05
