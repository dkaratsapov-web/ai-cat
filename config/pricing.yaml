# Тарифы для ПРЕДВАРИТЕЛЬНОЙ оценки стоимости. Фактическое списание может отличаться.
# verified: true  — значение взято из официальной документации (дата в checked)
# verified: false — значение из вторичных источников, обязательно сверьте в личном кабинете.
# Перед первой платной генерацией сверьте цены в кабинете и обновите checked.

kling:
  unit_usd: 0.098                    # Trial Package: $9.8 / 100 units (по прайсу — $0.14; при обычном пакете верните 0.14)
  source: https://kling.ai/document-api/pricing/base/video
  checked: 2026-09-20
  verified: true
  note: >-
    Единицы списываются из API resource packages. Кредиты обычной подписки Kling (app) НЕ считаются
    API-кредитами без подтверждения в личном кабинете (официального подтверждения обратного не найдено).
  models:
    # units за секунду
    kling-2.6:        {per_second: {720p: 0.3, 1080p: 0.5}, durations: [5, 10]}
    kling-2.6-audio:  {per_second: {1080p: 1.0}, durations: [5, 10]}
    kling-2.5-turbo:  {per_second: {720p: 0.3, 1080p: 0.5}, durations: [5, 10]}
    kling-3.0:        {per_second: {720p: 0.6, 1080p: 0.8}}
    kling-3.0-turbo:  {per_second: {720p: 0.8, 1080p: 1.0}}
    avatar:           {per_second: {std: 0.4, pro: 0.8}, assumption: "std≈720p, pro≈1080p — соответствие режимов не подтверждено"}
    lip-sync:         {per_5_seconds: 0.5}
    face-recognition: {per_call: 0.05}

higgsfield:
  # Цены по обзорам (mindstudio.ai, chaseai.io, сентябрь–октябрь 2026), НЕ из официального прайса:
  # перед первой генерацией сверьте в кабинете (Billing / страница модели) и поправьте.
  # Разбивка по разрешениям неизвестна — для 480p/720p стоит одна (верхняя) ставка; 1080p не задан намеренно:
  # без тарифа смета невозможна, и платный запуск не начнётся.
  source: https://www.mindstudio.ai/blog/higgsfield-api-pricing-pay-per-use
  checked: 2026-10-05
  verified: false
  models:
    bytedance/seedance-2.5/image-to-video: {usd_per_second: {480p: 0.2057, 720p: 0.2057}}
    bytedance/seedance-2.0/image-to-video: {usd_per_second: {480p: 0.1407, 720p: 0.1407}}
    # v1/speak/higgsfield — цена неизвестна: внесите из кабинета перед тестом

hedra:
  source: https://www.hedra.com/models/video/hedra/character-3
  checked: 2026-10-02
  verified: false
  models:
    hedra-character-3: {usd_per_second: {540p: 0.025, 720p: 0.05, 1080p: 0.0625}}

runway:
  credit_usd: 0.01
  source: https://docs.dev.runwayml.com/guides/pricing/
  checked: 2026-10-02
  verified: false
  models:
    gen4_turbo: {credits_per_second: 5}
    gen4.5:     {credits_per_second: 12}
    act_two:    {credits_per_second: 5}

yandex:
  # Yandex SpeechKit API v3: 1 единица = запрос до 250 символов (длиннее — по 250 с округлением вверх).
  rub_per_unit: 0.1626              # ₽ с НДС за запрос, модель general (официальная страница цен, скриншот владельца)
  rub_per_usd: 90                   # курс для пересчёта в $ бюджета — поставьте актуальный
  source: https://yandex.cloud/ru/docs/speechkit/pricing
  checked: 2026-10-03
  verified: true
  subscription_based: false
  # livetts — 0,25 ₽ за запрос; Brand Voice (свой голос) — от 9 150 ₽ разово + хостинг ~100 тыс. ₽/мес — не используем

elevenlabs:
  source: https://elevenlabs.io/pricing/api
  checked: 2026-10-02
  verified: false
  # Стоимость оценивается по подписке: $ за 1000 символов при полном расходе лимита.
  # Creator: $22 / 121k кредитов ≈ $0.18 за 1000 символов. Поменяйте под свой тариф.
  usd_per_1k_chars: 0.18
  credits_per_char: {eleven_multilingual_v2: 1.0, eleven_v3: 1.0, eleven_flash_v2_5: 0.5}
  subscription_based: true           # расход идёт из уже оплаченной подписки, а не сверх неё

salute:
  # Сбер SaluteSpeech (синтез). Тариф в этот файл не внесён: цену не нашёл в официальных источниках, доступных
  # из моей среды. Смотрите в личном кабинете (developers.sber.ru → SaluteSpeech → тариф) и впишите сюда,
  # тогда смета студии станет точной. Пока стоит 0 — подтверждение перед озвучкой всё равно спрашивается.
  rub_per_1000_chars: 0
  source: https://developers.sber.ru/docs/ru/salutespeech/overview
  checked: 2026-10-06
  verified: false

openai_tts:
  # OpenAI gpt-4o-mini-tts: цена в прайс студии не внесена (тарифицируется по токенам, смотрите
  # platform.openai.com → Pricing и Usage). Образцы и озвучка ролика — центы.
  usd_per_1000_chars: 0
  verified: false
