# Основная конфигурация AI Content Studio.
# Секреты (API-ключи) сюда НЕ пишутся — только в .env.

video:
  width: 1080
  height: 1920
  fps: 30
  codec: libx264
  crf: 18
  # Итоговый файл: средний битрейт (ТЗ: 12–20 Мбит/с). Уберите bitrate — будет режим постоянного качества (crf)
  bitrate: 14M
  maxrate: 18M
  bufsize: 28M
  preset: medium
  pix_fmt: yuv420p
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  min_duration: 20
  max_duration: 60          # обычные ролики 20–35 с; ТОПы и списки — до 60 с
  # Переходы между сценами: "cut" (склейка встык) или "xfade" (плавный)
  transition: xfade
  transition_duration: 0.25
  # Пауза после фразы внутри сцены, сек
  voice_tail: 0.15
  # Сокращение лишних пауз в озвучке (запись и темп не меняются; говорящие сцены не трогаем — там синхрон губ)
  voice_tighten:
    enabled: true
    noise_db: -42        # что считать тишиной
    lead: 0.05           # сколько тишины оставить перед фразой, сек
    tail: 0.1            # и после неё
    max_pause: 0.3       # паузы внутри фразы длиннее этого укорачиваются до него
  # Громкость итогового ролика (EBU R128); для соцсетей обычно -14 LUFS
  target_lufs: -14
  # «Живой слой» поверх сцен с котом (бесплатно, локально): наезд камеры, мерцание света, огоньки, пылинки, зерно.
  # Отключить для сцены: local: {ambient: false}. Тонкая настройка: local: {ambient: {zoom: 0.08}}
  ambient:
    enabled: true
    apply_to: [talking, character_motion, ai_scene]
    zoom: 0.05
    drift: 0.012
    flicker: 0.015
    bokeh: 16
    dust: 28
    grain: 0.035
    vignette: 0.28
    twinkle: 0            # 0 — огоньки светят ровно, без пульсирующих бликов

# Безопасные зоны 9:16: интерфейс Reels/Shorts/Клипов перекрывает верх и низ.
safe_area:
  top: 220
  bottom: 480
  left: 70
  right: 120

subtitles:
  enabled: true
  # Имя шрифта для libass. Положите TTF в assets/fonts — он подхватится автоматически.
  font_name: "Montserrat ExtraBold"
  fallback_font_name: "DejaVu Sans"
  font_size: 54                 # ТЗ: субтитры 42–54 px в кадре 1080×1920
  primary_color: "#FFFFFF"
  highlight_color: "#FFD43B"
  outline_color: "#000000"
  outline: 4
  shadow: 2
  # Отступ снизу (px) — выше нижней безопасной зоны
  margin_v: 560
  max_words_per_line: 5
  max_chars_per_line: 26
  uppercase: false

branding:
  background_color: "#14161C"
  accent_color: "#FFD43B"
  text_color: "#FFFFFF"
  muted_color: "#9AA3B2"
  rubric: "МяуРкетинг"

music:
  # Путь к фоновой музыке (относительно корня) или null. Используйте только треки с правом коммерческого использования.
  default_track: null
  volume: 0.12
  ducking: true

# Провайдеры по умолчанию для типов сцен (можно переопределить в сцене полем generator)
providers:
  video_default: kling
  talking_default: kling        # kling (image2video + lip-sync) | hedra | manual
  motion_default: kling
  complex_default: kling        # runway, когда будет подключён
  tts: yandex                   # yandex | elevenlabs | manual | mock

# Параметры моделей по провайдерам (можно переопределить в сцене через local.model / local.resolution)
kling:
  i2v_model: kling-2.6          # kling-2.6 | kling-2.5-turbo | kling-3.0-turbo
  resolution: 720p              # 720p дешевле; 1080p — для финального качества
  avatar_mode: std              # std | pro
  # Говорящие сцены: avatar — синхронизация губ по фото (работает с котом);
  #   motion_lipsync — живая анимация + Lip Sync, НО Lip Sync Kling распознаёт только людей (проверено 2026-10-04:
  #   «The model did not detect a human») — для кота даёт анимацию без движения губ. Можно задать в сцене: local.talking_mode
  talking_mode: avatar
# Higgsfield (агрегатор): Seedance для «вау»-сцен. В сцене: generator: higgsfield (+ local.model при желании)
higgsfield:
  i2v_model: bytedance/seedance-2.5/image-to-video   # id сверить в кабинете; 2.0 — bytedance/seedance-2.0/image-to-video (не проверен)
  resolution: 720p
  speak_model: v1/speak/higgsfield                    # говорящее видео; на коте не проверено
  speak_quality: mid
hedra:
  model: hedra-character-3
  resolution: 720p
runway:
  model: gen4_turbo
  ratio: "720:1280"

# Расходы. Значения в USD.
budget:
  monthly_usd: 75
  per_video_usd: 6
  warn_ratio: 0.8
  # Максимум платных попыток на одну сцену (защита от бесконечных перегенераций)
  max_attempts_per_scene: 3
  # Требовать интерактивное подтверждение каждой платной операции
  require_confirmation: true

generation:
  poll_interval_sec: 10
  poll_timeout_sec: 1800
  http_timeout_sec: 60
  max_http_retries: 4
