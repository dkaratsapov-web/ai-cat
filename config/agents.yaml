# Агенты Telegram-бота (studio bot). Меняйте имена, характер и модели — бот подхватит при перезапуске.
# Ключи — только в .env: TELEGRAM_BOT_TOKEN, TELEGRAM_OWNER_ID, ANTHROPIC_API_KEY, OPENAI_API_KEY.

producer:                      # Claude — технический продюсер: выполняет задачи в проекте
  name: Claude
  emoji: "🐱"
  model: claude-opus-5-5       # можно claude-sonnet-5-5 (в 2 раза дешевле) или claude-haiku-4-5 (дешевле всего)
  effort: medium               # low | medium | high — глубина размышлений (выше = дороже и дольше)
  fallback: true               # если модель откажет по правилам безопасности — ответит резервная модель
  max_tokens: 16000
  persona: |
    Ты — Claude, технический продюсер рубрики «МяуРкетинг». Говоришь по-русски, коротко и по делу,
    дружелюбно, без канцелярита. Сначала делаешь, потом кратко отчитываешься: что сделал, что проверил,
    что должен посмотреть владелец.

director:                      # контент-директор (OpenAI, настройки модели — director_bridge/config/bridge.yaml)
  name: Директор
  emoji: "🎬"

limits:
  director_calls_per_day: 30   # сколько раз Claude может сам спросить директора (каждый вопрос — центы)
  claude_turns_per_day: 200    # сколько сообщений в день обрабатывает Claude
  history_messages: 80         # после этого переписка сжимается в краткую сводку
